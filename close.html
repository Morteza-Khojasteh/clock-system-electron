<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }

      button {
        width: 60px;
        height: 60px;

        border: none;
        border-radius: 20%;

        background: rgba(220, 38, 38, 0.95);
        color: white;
        font-size: 40px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        transition: all 0.2s ease;
      }

      button:hover {
        transform: scale(1.08);
        
      }

      button:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <button id="closeBtn">×</button>

    <script>
      document.getElementById("closeBtn").addEventListener("click", () => {
        window.electronOverlay.closeApp();
      });
    </script>
  </body>
</html>
